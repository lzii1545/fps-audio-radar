[package]
name = "fps-audio-radar"
version = "0.1.0"
edition = "2021"
description = "公益无障碍项目：FPS 可视化脚步/枪声方位雷达（仅读取系统音频输出，与游戏进程零接触）"
license = "MIT"

[dependencies]
anyhow = "1"
env_logger = "0.11"
log = "0.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "x11",
    "wayland",
] }
# 显式关闭剪贴板特性：避免引入 arboard → winapi（需要额外的系统导入库）
egui-winit = { version = "0.29", default-features = false, features = ["wayland", "x11"] }
tiny-skia = "0.11"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
